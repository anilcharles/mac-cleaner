[package]
name = "mac-cleaner"
version = "1.1.0"
description = "A careful, good-looking cleaner for macOS"
edition = "2021"

[dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
walkdir = "2"
rayon = "1"
trash = "5"
anyhow = "1"
raw-window-handle = "0.6"
objc = "0.2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
