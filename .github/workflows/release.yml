# Builds Mac Cleaner on your own Mac (self-hosted runner) and publishes a GitHub Release.
# Trigger: push a tag that matches the version in Cargo.toml, e.g.
#   git tag v1.1.0 && git push origin v1.1.0
# The release notes are that version's section of CHANGELOG.md, which must exist.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the release and upload the DMG

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: ./scripts/changelog.sh "$VERSION" > "$RUNNER_TEMP/notes.md"

      - name: Tests
        run: cargo test --locked

      - name: Build app bundle
        run: ./scripts/bundle.sh

      - name: Build DMG
        run: |
          DMG="Mac-Cleaner-$VERSION-arm64.dmg"
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE" "$DMG"
          mkdir -p "$STAGE"
          ditto "target/release/Mac Cleaner.app" "$STAGE/Mac Cleaner.app"
          ln -s /Applications "$STAGE/Applications" # drag-to-install target
          hdiutil create -volname "Mac Cleaner $VERSION" -srcfolder "$STAGE" \
            -fs HFS+ -format UDZO -ov "$DMG"
          rm -rf "$STAGE"
          shasum -a 256 "$DMG" > "$DMG.sha256"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" \
            --title "Mac Cleaner $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
