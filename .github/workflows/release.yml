# Releases are driven by release-please (https://github.com/googleapis/release-please).
#
# 1. Every merge to main: release-please reads the new PR titles. If any is a `feat:` or `fix:`,
#    it opens or updates a "chore: release x.y.z" PR that bumps Cargo.toml / Cargo.lock and
#    lists the entries as release notes in its description. `docs:`, `ci:`, `chore:` and the
#    like are left out. There is no CHANGELOG.md; the GitHub Releases are the changelog.
# 2. Merging that release PR: release-please tags vx.y.z and creates the GitHub Release with the
#    same notes. Then this Mac (self-hosted runner) tests, builds the DMG and
#    attaches it to the release.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # tags, releases, the version-bump commit, DMG upload
  pull-requests: write # the release PR

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    # Only bookkeeping through the GitHub API, so it runs on GitHub's machines and keeps the
    # release PR up to date even while this Mac is off.
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Tests
        run: cargo test --locked

      - name: Build app bundle
        run: ./scripts/bundle.sh

      - name: Check app version
        run: |
          APP_VERSION=$(defaults read "$PWD/target/release/Mac Cleaner.app/Contents/Info.plist" CFBundleShortVersionString)
          if [ "$APP_VERSION" != "$VERSION" ]; then
            echo "::error::App says $APP_VERSION but the release is $VERSION"
            exit 1
          fi

      - name: Build DMG
        run: |
          DMG="Mac-Cleaner-$VERSION-arm64.dmg"
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE" "$DMG"
          mkdir -p "$STAGE"
          ditto "target/release/Mac Cleaner.app" "$STAGE/Mac Cleaner.app"
          ln -s /Applications "$STAGE/Applications" # drag-to-install target
          hdiutil create -volname "Mac Cleaner $VERSION" -srcfolder "$STAGE" \
            -fs HFS+ -format UDZO -ov "$DMG"
          rm -rf "$STAGE"
          shasum -a 256 "$DMG" > "$DMG.sha256"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      # The app installs an update only if this signature checks out against the public key built
      # into it (src/updater.rs). The trusted comment names the DMG, so a signature can't be reused
      # for another version.
      - name: Sign DMG
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::The MINISIGN_SECRET_KEY secret is missing"
            exit 1
          fi
          command -v minisign >/dev/null || brew install minisign
          KEY="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$KEY"' EXIT
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$KEY")
          minisign -S -s "$KEY" -m "$DMG" -t "$DMG" </dev/null
          PUBLIC_KEY=$(sed -n 's/^const PUBLIC_KEY: &str = "\(.*\)";/\1/p' src/updater.rs)
          minisign -V -P "$PUBLIC_KEY" -m "$DMG"

      - name: Attach DMG to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$DMG" "$DMG.sha256" "$DMG.minisig" --clobber
